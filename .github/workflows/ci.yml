name: CI                              # shown in GitHub's Actions tab

on:                                   # the events that start this workflow
  pull_request:                       # any PR being opened or updated
  push:
    branches: [main]                  # anything merged into main

jobs:
  api:                                # job 1: the Spring Boot backend
    runs-on: ubuntu-latest            # a fresh Linux VM
    defaults:
      run:
        working-directory: apps/api   # run commands from this folder
    services:
      postgres:                       # a Postgres container beside the job, like our docker-compose
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: namastute
          POSTGRES_USER: namastute
          POSTGRES_PASSWORD: namastute
        ports:
          - 5432:5432
        options: >-                   # wait until Postgres is actually ready
          --health-cmd "pg_isready -U namastute -d namastute"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:                          # Redis for the OTP tests, same as our docker-compose
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      seaweedfs:                      # S3-compatible storage for the ID verification tests, same as our docker-compose
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: namastute
          AWS_SECRET_ACCESS_KEY: namastute-dev-secret
          S3_BUCKET: namastute-verification
        ports:
          - 8333:8333
    steps:
      - uses: actions/checkout@v5     # download the repo onto the VM
      - uses: actions/setup-java@v5   # install Java
        with:
          distribution: temurin
          java-version: '21'
          cache: maven                # reuse downloaded jars between runs (much faster)
      # The OCR engine for the ID checks (Learning Notes 82); OpenCV's library comes inside its jar
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libtesseract5
          # Tess4J asks for libleptonica.so and libtesseract.so; Ubuntu names them liblept.so.5 and libtesseract.so.5
          cd /usr/lib/x86_64-linux-gnu && sudo ln -sf liblept.so.5 libleptonica.so && sudo ln -sf libtesseract.so.5 libtesseract.so
      - run: ./mvnw -B verify         # compile + all tests; -B = batch mode, cleaner logs
      # Drift check (Learning Notes 52.5): OpenApiExportTest just rewrote the API contract; fail if it differs from the commit
      - run: git diff --exit-code -- ../web/openapi.json || (echo "::error::apps/web/openapi.json is out of date. Run the API tests and commit it." && exit 1)

  web:                                # job 2: the Next.js frontend (runs in parallel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4    # install pnpm
        with:
          package_json_file: apps/web/package.json   # use the pnpm version declared there
      - uses: actions/setup-node@v5   # install Node.js
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile   # install exactly what the lockfile says
      # Drift check: the TypeScript types must match the committed API contract
      - run: pnpm api:types && git diff --exit-code -- lib/api-types.ts || (echo "::error::lib/api-types.ts is out of date. Run pnpm api:types and commit it." && exit 1)
      - run: pnpm lint
      - run: pnpm build